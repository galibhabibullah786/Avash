name = "avash-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Non-secret runtime config only. ENVIRONMENT is set per-env below.
# Real secrets are NEVER stored here (R2) — they are injected via
# `wrangler secret put <NAME>` locally, or as GitHub Actions secrets
# in CI/CD deploy workflows (see docs/security/secrets-matrix.md).
#
# Required secret inventory (names only — values are never committed):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_JWT_SECRET
#   GEMINI_API_KEY
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN
#   TURNSTILE_SECRET_KEY
#   CLOUDINARY_CLOUD_NAME
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#
# CORS_ALLOWED_ORIGINS / CORS_PREVIEW_ORIGIN_SUFFIX (§14, docs/constants-registry.md)
# are deploy-time config, not secrets — they're the public Cloudflare
# Pages domain. The values below are the LOCAL-DEV/MANUAL-DEPLOY FALLBACK
# only: `deploy-api.yml` overrides both with `wrangler deploy --var`,
# sourced from the `CORS_ALLOWED_ORIGINS`/`CORS_PREVIEW_ORIGIN_SUFFIX`
# GitHub Environment/repository variables (docs/ci-cd.md § Required
# secrets and repository variables), so the real domain can be set/changed
# on GitHub without a commit here. CORS_PREVIEW_ORIGIN_SUFFIX is a bare
# suffix, never a glob — apps/api/src/config/cors.ts builds the
# `[a-z0-9-]+.` wildcard itself and escapes this value as a literal, so a
# "*" in it matches nothing.
CORS_ALLOWED_ORIGINS = "https://avash.pages.dev"
CORS_PREVIEW_ORIGIN_SUFFIX = "avash.pages.dev"

# Wrangler does not merge [vars] across environments — each [env.*.vars]
# block below must redeclare every var it needs, or that var is simply
# absent when running under that environment.

[env.preview]
name = "avash-api-preview"

  [env.preview.vars]
  ENVIRONMENT = "preview"
  CORS_ALLOWED_ORIGINS = "https://avash.pages.dev"
  CORS_PREVIEW_ORIGIN_SUFFIX = "avash.pages.dev"

[env.production]
name = "avash-api-production"

  [env.production.vars]
  ENVIRONMENT = "production"
  CORS_ALLOWED_ORIGINS = "https://avash.pages.dev"
  CORS_PREVIEW_ORIGIN_SUFFIX = "avash.pages.dev"
