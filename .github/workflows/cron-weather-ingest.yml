name: cron-weather-ingest

# Runs scripts/jobs/weather-ingest.ts on a schedule (WEATHER_INGEST_CADENCE
# = every 3h, docs/PROJECT_PLAN.md §14). Connects directly to Supabase —
# never through an apps/api HTTP endpoint (ADR-007). Guarded on all three
# credentials' presence, like deploy-api.yml's Cloudflare check — no-ops
# cleanly rather than failing noisily every 3h if any one of them isn't
# configured yet.
#
# See docs/ci-cd.md § Pausing and resuming scheduled runs for how to pause
# this job (e.g. during an extended OpenWeatherMap outage) without editing
# this file.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-weather-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check ingest credentials
        id: creds-check
        # Same pattern as deploy-api.yml's Cloudflare check: only
        # emptiness is tested via env:, the value is never echoed or
        # interpolated as `${{ }}` into the script body.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$OPENWEATHERMAP_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / OPENWEATHERMAP_API_KEY not fully set — skipping ingest. See docs/ci-cd.md."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.creds-check.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds-check.outputs.configured == 'true'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.creds-check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run weather ingest
        if: steps.creds-check.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: pnpm tsx scripts/jobs/weather-ingest.ts
