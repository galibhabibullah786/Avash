name: build-images

# hadolint + build + Trivy + smoke test + publish for the two app images
# (ADR-012). Called by pipeline.yml as the stage between the gates and the
# deploys: nothing deploys until an image of the same commit has been built
# and scanned clean.
#
# Publishing is decided by the caller, not by inspecting `github.ref` here
# — a reusable workflow that reads the event it was called from is a
# workflow with two sources of truth.

on:
  workflow_call:
    inputs:
      publish:
        description: Push the built images to GHCR. False for pull requests.
        type: boolean
        required: false
        default: false
      channel:
        description: '"production" (main) or "preview" (dev / PR) — decides the moving tag.'
        type: string
        required: false
        default: preview

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: apps/web/Dockerfile
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: apps/api/Dockerfile
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: docker/ml.Dockerfile

  images:
    needs: lint-dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/avash-${{ matrix.app }}
          # `sha-<short>` is the immutable handle every consumer should
          # pin to. The moving tag tracks the channel: `latest` follows
          # main, `dev` follows the integration branch.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ inputs.channel == 'production' }}
            type=raw,value=dev,enable=${{ inputs.channel == 'preview' }}

      # Build locally first. Nothing reaches the registry until the scan
      # and the smoke test have both passed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: avash-${{ matrix.app }}:ci
          build-args: |
            VITE_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || 'http://localhost:8787' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `output:` writes the report before the non-zero exit is applied,
      # so one scan both gates the build and feeds the weekly CVE report
      # (pipeline.yml's cve-report job). Still hard-fail: `exit-code: 1`.
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: avash-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.app }}.txt

      - name: Upload this image's scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.app }}
          path: trivy-${{ matrix.app }}.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Smoke test
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "api" ]; then
            docker run -d --name smoke -p 8787:8787 \
              -e CORS_ALLOWED_ORIGINS=http://localhost:8080 \
              avash-api:ci
            for _ in $(seq 1 30); do
              curl -fsS http://localhost:8787/health >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost:8787/health | tee /dev/stderr | grep -q '"status":"ok"'
          else
            docker run -d --name smoke -p 8080:8080 avash-web:ci
            for _ in $(seq 1 30); do
              curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost:8080/ | grep -qi '<!doctype html'
            curl -sI http://localhost:8080/ | grep -qi 'content-security-policy'
          fi
          docker rm -f smoke

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL || 'http://localhost:8787' }}
          cache-from: type=gha
