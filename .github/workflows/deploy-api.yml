name: deploy-api

# `wrangler deploy` for apps/api (docs/PROJECT_PLAN.md §11). Secrets are
# injected from GitHub Actions secrets via `wrangler secret put`, never
# committed (R2). Guarded on token presence like deploy-web.yml — no-ops
# cleanly when Cloudflare is not yet configured. A post-deploy smoke test
# against the live /health endpoint fails the job if the deploy did not
# actually come up healthy.
#
# Called by pipeline.yml only after every gate and the image scan are
# green. Which Worker environment it targets is the caller's decision,
# passed in as `wrangler_env` — the environments themselves are declared
# in apps/api/wrangler.toml.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          GitHub Environment ("preview" or "production") to draw secrets
          and variables from (docs/security/github-environments.md).
        type: string
        required: true
      wrangler_env:
        description: >-
          wrangler environment from apps/api/wrangler.toml: "production"
          (main) or "preview" (dev).
        type: string
        required: true
      smoke_test_origin_var:
        description: >-
          Name of the repository variable holding the deployed Worker's
          origin for the post-deploy smoke test.
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_JWT_SECRET:
        required: false
      GEMINI_API_KEY:
        required: false
      UPSTASH_REDIS_REST_URL:
        required: false
      UPSTASH_REDIS_REST_TOKEN:
        required: false
      TURNSTILE_SECRET_KEY:
        required: false
  # A direct, standalone trigger for an urgent deploy that doesn't need
  # the full pipeline.yml graph rebuilt — same job, same environment:
  # gating below, just reachable without going through the caller.
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to draw secrets and variables from.
        type: choice
        options: [preview, production]
        required: true
      wrangler_env:
        description: >-
          wrangler environment from apps/api/wrangler.toml: "production"
          (main) or "preview" (dev).
        type: choice
        options: [preview, production]
        required: true
      smoke_test_origin_var:
        description: >-
          Name of the repository variable holding the deployed Worker's
          origin for the post-deploy smoke test (e.g.
          PRODUCTION_API_ORIGIN or PREVIEW_API_ORIGIN).
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # See the identical comment in deploy-web.yml — set here so a direct
    # workflow_dispatch run resolves this environment's secrets/vars and
    # protection rules without a caller job to declare it on.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - run: pnpm --filter api typecheck

      - name: Check Cloudflare credentials
        id: cf-check
        # Secrets are read through `env:`, never interpolated as `${{ }}`
        # into the script body — see the same step in deploy-web.yml for
        # why. Only emptiness is tested; the value is never echoed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy. See docs/ci-cd.md."
          fi

      - name: Resolve CORS override flags
        id: cors-flags
        # CORS_ALLOWED_ORIGINS / CORS_PREVIEW_ORIGIN_SUFFIX are non-secret
        # deploy-time config (docs/ci-cd.md § Required secrets and
        # repository variables); when set as a GitHub Environment or
        # repository variable of the same name, they override
        # wrangler.toml's local-dev fallback via `wrangler deploy --var`.
        # Left unset, no flag is emitted and wrangler.toml's committed
        # placeholder still applies — never overridden with an empty
        # string, which would deny every origin.
        env:
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CORS_PREVIEW_ORIGIN_SUFFIX: ${{ vars.CORS_PREVIEW_ORIGIN_SUFFIX }}
        run: |
          args=""
          if [ -n "$CORS_ALLOWED_ORIGINS" ]; then
            args="$args --var CORS_ALLOWED_ORIGINS:$CORS_ALLOWED_ORIGINS"
          fi
          if [ -n "$CORS_PREVIEW_ORIGIN_SUFFIX" ]; then
            args="$args --var CORS_PREVIEW_ORIGIN_SUFFIX:$CORS_PREVIEW_ORIGIN_SUFFIX"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.cf-check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # `environment` is what scopes the SECRET UPLOAD — wrangler-action
          # runs `wrangler secret bulk` with `--env <environment>` and, with
          # this input unset, uploads to the top-level Worker (`avash-api`)
          # regardless of what `command` targets. That is how SUPABASE_URL
          # could be "successfully created" in the log while every request to
          # avash-api-production still threw "supabaseUrl is required."
          # The action skips its own `--env` injection when the command
          # already carries one (wranglerAction.ts: `!command.includes("--env")`),
          # so the explicit flag below is not duplicated.
          environment: ${{ inputs.wrangler_env }}
          command: deploy --env ${{ inputs.wrangler_env }} ${{ steps.cors-flags.outputs.args }}
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_JWT_SECRET
            GEMINI_API_KEY
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
            TURNSTILE_SECRET_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      # The caller names which repository variable holds this
      # environment's origin, so production and preview smoke-test
      # themselves rather than both pointing at production.
      - name: Post-deploy smoke test
        if: steps.cf-check.outputs.configured == 'true'
        env:
          API_ORIGIN: ${{ vars[inputs.smoke_test_origin_var] }}
          ORIGIN_VAR_NAME: ${{ inputs.smoke_test_origin_var }}
          WRANGLER_ENV: ${{ inputs.wrangler_env }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::error::$ORIGIN_VAR_NAME repository variable is not set — cannot smoke test the deploy."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "$API_ORIGIN/health")
          echo "GET $API_ORIGIN/health -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::Post-deploy smoke test failed: /health returned $status, expected 200."
            exit 1
          fi
          # /health is liveness only — it touches neither Supabase nor the
          # secrets, so it stayed green through the whole "secrets uploaded
          # to the wrong Worker" outage. /health/db builds the service-role
          # client and runs a bounded query, so it is the probe that
          # actually proves SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY landed
          # on the Worker this deploy targeted. Missing secrets => 503 here
          # => the deploy fails instead of shipping a Worker that 500s on
          # every real request.
          db_status=$(curl -s -o /dev/null -w '%{http_code}' "$API_ORIGIN/health/db")
          echo "GET $API_ORIGIN/health/db -> $db_status"
          if [ "$db_status" != "200" ]; then
            echo "::error::Post-deploy smoke test failed: /health/db returned $db_status, expected 200. The Worker cannot reach Supabase — check that SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY were uploaded to the '$WRANGLER_ENV' Worker environment."
            exit 1
          fi
