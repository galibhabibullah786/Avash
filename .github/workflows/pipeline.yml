name: pipeline

# The single entrypoint for pull requests and for pushes to main and dev.
# Everything else under .github/workflows/ is either called from here
# (`on: workflow_call`) or is a standalone scheduled job (the cron-*
# workflows).
#
# WHY ONE WORKFLOW: `needs:` only sequences jobs inside a single workflow.
# While ci.yml, build-images.yml and the two deploy workflows each carried
# their own `push: [main]` trigger they ran as four independent races — a
# deploy could ship while the suite was still running, or after it had
# already failed, which is exactly what docs/standards/git-workflow.md
# claimed could not happen. Composing them as reusable workflows here
# turns that claim into a real edge in the graph:
#
#   ci + codeql  ->  deploy-web + deploy-api + deploy-notify
#
# `workflow_run` would also sequence them, but it reports no status on the
# pull request and always executes the default branch's copy of the
# workflow — meaning a change to the pipeline could never be tested by the
# pull request making it. Reusable workflows resolve to the caller's own
# commit, so this file tests itself.

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      bypass_gates:
        description: >-
          Break-glass only. Skip waiting on ci/codeql before deploying —
          the gate jobs still run and still show their real red/green, this
          only stops a bypassed one from blocking deploys. Does not touch
          each environment's own required-reviewer protection rule, which
          still applies normally. Only meaningful on this manual trigger;
          ignored on push/pull_request.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Superseding a pull request run is free. Cancelling a run that has
  # reached the deploy stage is not — it can leave a half-applied
  # `wrangler deploy` behind.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch -> channel resolution, once, in one place. Without this every
  # downstream job re-derives "am I production?" from github.ref and they
  # drift apart the first time one of them is edited alone.
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      publish: ${{ steps.resolve.outputs.publish }}
      deploy_web: ${{ steps.resolve.outputs.deploy_web }}
      deploy_api: ${{ steps.resolve.outputs.deploy_api }}
      deploy_functions: ${{ steps.resolve.outputs.deploy_functions }}
      pages_branch: ${{ steps.resolve.outputs.pages_branch }}
      wrangler_env: ${{ steps.resolve.outputs.wrangler_env }}
      origin_var: ${{ steps.resolve.outputs.origin_var }}
      environment: ${{ steps.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          # Determine base commit for change detection
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "$EVENT" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || echo "")

          web_changed=false
          api_changed=false
          functions_changed=false

          if echo "$CHANGED_FILES" | grep -qE '^(apps/web/|packages/ui/|packages/types/|packages/config/|\.github/workflows/deploy-web\.yml)'; then
            web_changed=true
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(apps/api/|packages/security/|packages/types/|packages/geo/|packages/logger/|packages/config/|\.github/workflows/deploy-api\.yml)'; then
            api_changed=true
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(packages/db/|packages/push/|packages/types/)'; then
            functions_changed=true
          fi

          # Manual workflow_dispatch deploys all stacks unless selectively gated
          if [ "$EVENT" = "workflow_dispatch" ]; then
            web_changed=true
            api_changed=true
            functions_changed=true
          fi

          channel=preview
          publish=false
          deploy_web=false
          deploy_api=false
          deploy_functions=false
          pages_branch="$HEAD_REF"
          wrangler_env=preview
          origin_var=PREVIEW_API_ORIGIN

          case "$EVENT" in
            pull_request)
              if [ "$web_changed" = "true" ]; then
                deploy_web=true
              fi
              ;;
            push | workflow_dispatch)
              case "$REF_NAME" in
                main)
                  channel=production
                  publish=true
                  pages_branch=main
                  wrangler_env=production
                  origin_var=PRODUCTION_API_ORIGIN
                  deploy_web="$web_changed"
                  deploy_api="$api_changed"
                  deploy_functions="$functions_changed"
                  ;;
                dev)
                  publish=true
                  pages_branch=dev
                  deploy_web="$web_changed"
                  deploy_api="$api_changed"
                  deploy_functions="$functions_changed"
                  ;;
                *)
                  echo "::notice::$REF_NAME is not a deploy branch — gates only."
                  ;;
              esac
              ;;
          esac

          if [ "$EVENT" = "workflow_dispatch" ] && [ "${{ inputs.bypass_gates }}" = "true" ]; then
            echo "::warning::bypass_gates is set — deployments will proceed even if ci or codeql failed."
          fi

          {
            echo "channel=$channel"
            echo "publish=$publish"
            echo "deploy_web=$deploy_web"
            echo "deploy_api=$deploy_api"
            echo "deploy_functions=$deploy_functions"
            echo "pages_branch=$pages_branch"
            echo "wrangler_env=$wrangler_env"
            echo "origin_var=$origin_var"
            echo "environment=$channel"
          } | tee -a "$GITHUB_OUTPUT"

  # ---- Stage 1: gates. Nothing is built for release until these pass. ----

  ci:
    uses: ./.github/workflows/ci.yml

  codeql:
    # Granted at the call site: a called workflow can never hold more
    # permission than its caller job hands it.
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  # ---- Stage 2: deploy. Reached only through quality gates above. ----

  deploy-web:
    needs: [context, ci, codeql]
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.deploy_web == 'true' &&
      (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true)) &&
      (needs.codeql.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true))
    # No `environment:` here — GitHub's schema does not allow it on a job
    # that also has `uses:` (a reusable-workflow call). `deploy-web.yml`'s
    # own job carries `environment: ${{ inputs.environment }}` instead.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-web.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    with:
      environment: ${{ needs.context.outputs.environment }}
      pages_branch: ${{ needs.context.outputs.pages_branch }}

  deploy-api:
    needs: [context, ci, codeql]
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.deploy_api == 'true' &&
      (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true)) &&
      (needs.codeql.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true))
    uses: ./.github/workflows/deploy-api.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    with:
      environment: ${{ needs.context.outputs.environment }}
      wrangler_env: ${{ needs.context.outputs.wrangler_env }}
      smoke_test_origin_var: ${{ needs.context.outputs.origin_var }}

  deploy-functions:
    name: Deploy Supabase Functions
    needs: [context, ci, codeql]
    if: |
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.deploy_functions == 'true' &&
      (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true)) &&
      (needs.codeql.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.bypass_gates == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Deploy risk-alerts Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            pnpm --filter @avash/db exec supabase functions deploy risk-alerts --project-ref "${SUPABASE_PROJECT_REF:-kdklmbqkczkaakgswlix}"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set; skipping Edge Function deploy."
          fi
