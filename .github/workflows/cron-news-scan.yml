name: cron-news-scan

# Runs scripts/jobs/news-scan.ts on a schedule (docs/PROJECT_PLAN.md §6 —
# the News Aggregator Agent). Connects directly to Supabase — never
# through an apps/api HTTP endpoint (ADR-007). The job script is still an
# empty stub and the database schema does not exist yet, so this run
# no-ops cleanly with a clear message rather than failing.
#
# The stub guard runs BEFORE any toolchain setup, so a no-op run costs
# seconds of billed time instead of a full pnpm install — see
# docs/ci-cd.md § Pausing and resuming scheduled runs.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Guard — job script not yet implemented
        id: guard
        run: |
          if [ ! -s scripts/jobs/news-scan.ts ]; then
            echo "::notice::scripts/jobs/news-scan.ts is an empty stub — this job ships with the news aggregator agent slice (docs/PROJECT_PLAN.md §13). Exiting cleanly."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run news scan
        if: steps.guard.outputs.ready == 'true'
        # Secrets arrive as environment variables and are read by the
        # script directly — never interpolated as `${{ }}` into the script
        # body. Any value sourced from `secrets.*` is registered as a log
        # mask automatically, so an explicit `::add-mask::` echo adds
        # nothing and is actively harmful for a multi-line credential:
        # echoing it registers only the first line as a mask and prints
        # the remaining lines in the clear.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm tsx scripts/jobs/news-scan.ts
