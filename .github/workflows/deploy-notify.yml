name: deploy-notify

# Vercel deploy for apps/notify (docs/adr/ADR-016-dedicated-notification-service.md).
# apps/notify is a thin adapter over packages/push — a Supabase Database
# Webhook receiver and an Inngest function definition, both running on
# Vercel rather than Cloudflare. Modeled on deploy-api.yml's shape and
# reasoning as closely as the different vendor allows; read that file's
# comments too if something here looks unmotivated.
#
# This workflow must be safe when Vercel is not yet configured: apps/notify
# lands on dev/main before its Vercel project is actually provisioned, so
# the deploy step is guarded on VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID
# being present and no-ops cleanly otherwise — same contract as
# deploy-web.yml/deploy-api.yml's Cloudflare guard, never a hard pipeline
# failure for a downstream service's credentials not existing yet.
#
# Called by pipeline.yml only after every gate and the image scan are
# green. Which Vercel/Inngest environment it targets is the caller's
# decision, passed in as `vercel_target`.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          GitHub Environment ("preview" or "production") to draw secrets
          and variables from (docs/security/github-environments.md).
        type: string
        required: true
      vercel_target:
        description: >-
          Vercel environment to build/deploy against: "production" (main)
          or "preview" (dev) — passed to `vercel pull --environment` and
          `vercel build`/`vercel deploy` (--prod only for "production").
        type: string
        required: true
      smoke_test_origin_var:
        description: >-
          Name of the repository variable holding the deployed apps/notify
          origin for the post-deploy smoke test.
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      INNGEST_EVENT_KEY:
        required: false
      INNGEST_SIGNING_KEY:
        required: false
      ANNOUNCEMENT_WEBHOOK_SECRET:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      VAPID_PUBLIC_KEY:
        required: false
      VAPID_PRIVATE_KEY:
        required: false
  # A direct, standalone trigger for an urgent deploy that doesn't need the
  # full pipeline.yml graph rebuilt — same job, same environment: gating
  # below, just reachable without going through the caller.
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to draw secrets and variables from.
        type: choice
        options: [preview, production]
        required: true
      vercel_target:
        description: >-
          Vercel environment to build/deploy against: "production" (main)
          or "preview" (dev).
        type: choice
        options: [preview, production]
        required: true
      smoke_test_origin_var:
        description: >-
          Name of the repository variable holding the deployed apps/notify
          origin for the post-deploy smoke test (e.g.
          PRODUCTION_NOTIFY_ORIGIN or PREVIEW_NOTIFY_ORIGIN).
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # See the identical comment in deploy-api.yml/deploy-web.yml — set here
    # so a direct workflow_dispatch run (no caller job to declare it on)
    # still resolves this environment's secrets/vars and still requires its
    # protection rules. GitHub's schema forbids `environment:` on a job
    # that also has `uses:` (a reusable-workflow call), which is why
    # pipeline.yml's deploy-notify job below does NOT repeat this — putting
    # it on both is not a belt-and-suspenders redundancy, it is a schema
    # error that fails the whole workflow file to parse ("Invalid workflow
    # file", zero jobs shown by `act -l`), exactly as it did for
    # deploy-web/deploy-api on this branch before that got fixed.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - run: pnpm --filter notify typecheck

      - name: Check Vercel credentials
        id: vercel-check
        # Secrets are read through `env:`, never interpolated as `${{ }}`
        # into the script body — a `${{ secrets.X }}` inside `run:` is
        # substituted into the shell script text before execution, which
        # writes the plaintext value into a script file on the runner and
        # lets a value containing shell metacharacters alter the command
        # (see the identical comment in deploy-web.yml). Only emptiness is
        # tested here — no value is ever echoed. All three are required:
        # `vercel pull`/`build`/`deploy` need the org and project id to
        # resolve which Vercel project they're even talking to, not just a
        # valid token.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping deploy. See docs/ci-cd.md."
          fi

      # Pinned, not `@latest`. The deploy contract this workflow depends
      # on (the Build Output API layout written by
      # apps/notify/scripts/build-vercel.mjs, and `deploy --prebuilt`'s
      # treatment of it) is a CLI-version-dependent interface, and a
      # floating `@latest` turns any CLI release into an unannounced
      # change to a production deploy path. Bump deliberately.
      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.configured == 'true'
        run: pnpm add --global vercel@59.1.4

      - name: Resolve deploy flags
        id: deploy-flags
        env:
          VERCEL_TARGET: ${{ inputs.vercel_target }}
        run: |
          if [ "$VERCEL_TARGET" = "production" ]; then
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment configuration
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/notify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment="${{ inputs.vercel_target }}" --token="$VERCEL_TOKEN"

      # NOT `vercel build`. Vercel's zero-config `api/` detection
      # transpiles each api/*.ts and then relies on its own node_modules
      # tracing to ship the dependencies — tracing that does not follow
      # this repo's pnpm layout, where first-party deps are `workspace:*`
      # symlinks into packages/ and third-party ones live in the
      # root-hoisted store. That produced two separate failures on this
      # workflow: `vercel deploy --prebuilt` refusing to upload at all
      # ("File does not exist: apps/notify/node_modules/@avash/types"),
      # and, when it did upload, a function that crashed on first
      # invocation with ERR_MODULE_NOT_FOUND for `inngest` — so
      # /api/inngest returned FUNCTION_INVOCATION_FAILED and Inngest could
      # neither register nor invoke anything.
      #
      # build-vercel.mjs esbuilds each function into a self-contained
      # bundle in the Build Output API layout, leaving Vercel no
      # resolution to get wrong. See its header comment for the detail.
      - name: Build the Vercel deployment bundle
        if: steps.vercel-check.outputs.configured == 'true'
        run: pnpm --filter notify build:vercel

      - name: Deploy pre-built output to Vercel
        id: deploy
        if: steps.vercel-check.outputs.configured == 'true'
        working-directory: apps/notify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.deploy-flags.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # THE STEP PEOPLE FORGET. Vercel serving new code and Inngest knowing
      # about it are two separate facts — Inngest keeps invoking whatever
      # function versions it last saw registered until something tells it
      # to re-sync. A `vercel deploy` alone ships the new bundle and
      # silently leaves Inngest invoking stale function definitions against
      # it, which is a real, easy-to-miss failure mode (the deploy is green,
      # /api/inngest answers, and the *previous* function set keeps running
      # against the new code, or new event/step shapes it was never built to
      # handle). A `PUT` to the deployed app's own `/api/inngest` serve
      # endpoint is what tells Inngest's platform to re-introspect that URL
      # and pick up the current function set — the same effect the
      # `inngest-cli deploy` command has, done here with plain curl since it
      # needs no extra toolchain. Signing is handled by Inngest calling back
      # into /api/inngest with INNGEST_SIGNING_KEY already configured in the
      # Vercel project (§ secrets-matrix.md), not by this request itself.
      #
      # This PUT is also THE deploy's real correctness check, which is why
      # its response body is inspected rather than only its status. Inngest
      # validates the whole function set at registration time and rejects
      # the app as a unit: a single function declaring more concurrency
      # than the account's plan allows answers
      #   400 {"message":"The function 'announcement-push-delivery' has
      #        higher concurrency limits (10) than your plan limit of 5",
      #        "modified":false}
      # and NOTHING registers — not the delivery function, not the sweep.
      # That is a silent outage with a green deploy, and it is exactly what
      # was happening (see ANNOUNCEMENT_PUSH_RUN_CONCURRENCY in
      # packages/types/alerts.ts). `modified` is reported for visibility,
      # not asserted on: a redeploy whose function definitions are
      # byte-identical legitimately answers `modified: false`.
      - name: Sync Inngest app registration
        if: steps.vercel-check.outputs.configured == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          response=$(curl -s -w '\n%{http_code}' -X PUT "$DEPLOY_URL/api/inngest")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "PUT $DEPLOY_URL/api/inngest -> $status"
          echo "$body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Inngest app registration failed: PUT /api/inngest returned $status — $(echo "$body" | jq -r '.message? // "no message in response body"' 2>/dev/null). No function in the app is registered, so no announcement will be delivered, regardless of the deploy looking green. Vercel is serving the new code but Inngest is not invoking it."
            exit 1
          fi

          echo "Inngest reported modified=$(echo "$body" | jq -r '.modified? // "unknown"' 2>/dev/null)"

      # The caller names which repository variable holds this environment's
      # origin, so production and preview smoke-test themselves rather than
      # both pointing at production — same reasoning as deploy-api.yml.
      #
      # This step used to `GET /api/inngest`, require 200, and count
      # objects carrying an `id` in the body. Every one of those three
      # assumptions was wrong about what the endpoint actually returns,
      # and the step could not have passed against a healthy deploy:
      #
      #   - In CLOUD mode the SDK requires a signed introspection request,
      #     so an unsigned GET answers `401 {"message":"Unauthorized"}`,
      #     never 200. (The 200 the step was written against is what the
      #     endpoint returns in DEV mode — which is what the local Docker
      #     stack runs, and why this looked fine there.)
      #   - Even in dev mode the introspection body is
      #     `{"function_count":2,"has_signing_key":true,...}` — a count,
      #     with no per-function objects and no `id` keys anywhere. The
      #     jq filter would have found 0 and failed the step on a
      #     perfectly healthy deploy.
      #
      # Whether Inngest actually holds the current function set is not
      # knowable from this endpoint at all; it is exactly what the PUT in
      # the previous step establishes, and that step now asserts it. What
      # is left for this one is the thing the PUT cannot prove: that the
      # ORIGIN the Supabase Database Webhook and Inngest will call in
      # steady state — the stable alias, not the one-off deployment URL
      # the PUT used — serves this function rather than 404ing or dying on
      # boot. `x-inngest-sdk-handled` is the discriminator: the SDK sets it
      # on its own responses, including the 401, so its presence proves the
      # bundle loaded and the serve handler ran. A missing route (404) or a
      # bundle that failed to load (FUNCTION_INVOCATION_FAILED, which is
      # how the pre-esbuild deploy failed) has no such header.
      - name: Post-deploy smoke test
        if: steps.vercel-check.outputs.configured == 'true'
        env:
          NOTIFY_ORIGIN: ${{ vars[inputs.smoke_test_origin_var] }}
          ORIGIN_VAR_NAME: ${{ inputs.smoke_test_origin_var }}
        run: |
          if [ -z "$NOTIFY_ORIGIN" ]; then
            echo "::error::$ORIGIN_VAR_NAME repository variable is not set — cannot smoke test the deploy."
            exit 1
          fi

          headers=$(curl -s -D - -o /dev/null "$NOTIFY_ORIGIN/api/inngest")
          status=$(echo "$headers" | head -n1)
          echo "GET $NOTIFY_ORIGIN/api/inngest -> $status"

          if ! echo "$headers" | grep -qi '^x-inngest-sdk-handled:'; then
            echo "$headers"
            echo "::error::Post-deploy smoke test failed: $NOTIFY_ORIGIN/api/inngest did not answer with an x-inngest-sdk-handled header, so the Inngest serve handler is not running there. A 404 means the route is missing; a 500/FUNCTION_INVOCATION_FAILED means the function bundle failed to load; a 3xx to vercel.com/sso-api means Vercel Deployment Protection is enabled on this environment and neither Inngest nor Supabase can reach it either (docs/ci-cd.md)."
            exit 1
          fi

          # The other half of the deploy is the Database Webhook receiver,
          # and it is the half that carries the fast path — if it is
          # missing, announcements still eventually go out via the sweep,
          # which is precisely the kind of degradation that hides for
          # weeks. An unauthenticated POST is the safest possible probe of
          # it: the handler compares the shared secret before it reads the
          # body or touches Inngest, so a 401 proves the route exists, the
          # bundle loaded, and ANNOUNCEMENT_WEBHOOK_SECRET is configured,
          # while sending nothing and enqueueing nothing. A 404 means the
          # function is missing; a 202 would mean the endpoint accepts
          # unauthenticated delivery requests from anyone, which is a
          # security failure, not a passing smoke test.
          webhook_status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$NOTIFY_ORIGIN/api/announcement-published")
          echo "POST $NOTIFY_ORIGIN/api/announcement-published (unauthenticated) -> $webhook_status"

          if [ "$webhook_status" != "401" ]; then
            echo "::error::Post-deploy smoke test failed: unauthenticated POST /api/announcement-published returned $webhook_status, expected 401. 404 means the webhook receiver did not deploy and the fast path is gone (announcements would only go out on the next sweep). 202 means the endpoint is accepting unauthenticated delivery requests — treat that as an incident, not a flake."
            exit 1
          fi
