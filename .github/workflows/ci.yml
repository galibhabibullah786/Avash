name: ci

# Enforces docs/PROJECT_PLAN.md §11's merge gate list. No step here may use
# `continue-on-error` or `|| true` — a failing gate must fail the run
# (docs/standards/git-workflow.md).
#
# Called by pipeline.yml, never triggered directly: this is the first stage
# of a single gated graph (gates -> image build+scan -> deploy), and a
# trigger of its own would double every run. Triggers, concurrency and
# branch routing all live in the caller.
#
# The gates run as concurrent jobs rather than as sequential steps in one
# job. §11 fixes the *dependency* order (a bundle budget check needs a
# build), not a total order — lint has no reason to wait on typecheck.
# Each job re-installs, which is cheap against the warm pnpm store the
# composite action maintains.

on:
  workflow_call:

permissions:
  contents: read

env:
  # docs/PROJECT_PLAN.md §14 — frontend shell bundle budget.
  FRONTEND_BUNDLE_BUDGET_KB: 180

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Lint (zero errors, zero warnings)
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Typecheck
        run: pnpm typecheck

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Unused exports (ts-prune)
        run: pnpm dlx ts-prune --error
      - name: No internal planning references (CONTRIBUTING.md § Terminology)
        run: node scripts/check-internal-refs.mjs
      - name: Agent config in sync (docs/standards/agent-compliance.md)
        run: pnpm agent:sync
      - name: Promotion path (docs/standards/git-workflow.md § Hard rule)
        run: node scripts/check-promotion-path.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # Vitest — packages/* (node), apps/api routes/middleware (workerd via
  # @cloudflare/vitest-pool-workers), apps/web hooks/pure modules (jsdom).
  # No browser, no built dist/, so this does not wait on `build`
  # (docs/standards/testing.md). Coverage thresholds are a merge gate, not
  # advisory — a threshold miss fails this job.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Test + coverage (Vitest — packages/*, apps/api workerd, apps/web jsdom)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          retention-days: 7

  # apps/api's Playwright contract suite (boundary cases only — the
  # exhaustive matrix lives in the `test` job above) against a live
  # `wrangler dev` instance the spec's own config starts.
  e2e-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright OS dependencies (no browser fixture — request-only)
        run: pnpm --filter api exec playwright install-deps
      - name: apps/api contract suite (wrangler dev)
        run: pnpm --filter api test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-api-${{ github.sha }}
          path: |
            apps/api/playwright-report
            apps/api/test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Build
        # apps/web/src/lib/env.ts throws at module load — not at build time —
        # if any of these four are unset, which crashes the whole app before
        # it mounts. This dist is what e2e-web boots as a "production
        # preview", so an unset var here doesn't fail this job; it fails
        # every Playwright spec downstream with an unrelated-looking
        # "element not found" (or, since SessionProvider now eagerly
        # constructs the Supabase client, every single test alike, since the
        # app never renders at all). VITE_PUBLIC_API_BASE_URL matches the
        # origin apps/web/e2e/health-integration.spec.ts intercepts — nothing
        # here ever makes a real network call. The Supabase/Turnstile values
        # are the real project's public, non-secret identifiers (RLS gates
        # data access, not URL/anon-key secrecy — §4.1) and match
        # apps/web/.env's real local-dev values exactly.
        env:
          VITE_PUBLIC_API_BASE_URL: http://localhost:8787
          VITE_PUBLIC_SUPABASE_URL: https://kdklmbqkczkaakgswlix.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtka2xtYnFrY3prYWFrZ3N3bGl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTA0MTQsImV4cCI6MjEwMTMyNjQxNH0.nQne8sH2JCeFRMVfASZXUONOhwdhSJ4MF7mfGAntwmU
          VITE_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEF8Y4SGwo17ABsD
        run: pnpm build

      - name: Bundle budget check (FRONTEND_BUNDLE_BUDGET_KB, §14)
        run: node scripts/check-bundle-budget.mjs

      - name: Bundle env-var scan (no non-VITE_PUBLIC_ reference reaches the client, §7.1/R2)
        run: node scripts/scan-client-env.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          retention-days: 1

  e2e-web:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium + Firefox — no browser fixture elsewhere)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium firefox

      - name: Install Playwright OS dependencies only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium firefox

      - name: apps/web end-to-end (production preview)
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Same apps/api Playwright suite, run a second time against the Node
  # container image instead of `wrangler dev` (ADR-012's parity obligation
  # — a spec that passes on one runtime and fails on the other is a real
  # divergence, not a flake, so nothing here may be skipped or softened).
  api-container-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Build the API container image
        run: docker build -f apps/api/Dockerfile -t avash-api:ci .

      - name: Start the API container
        # Same CORS_ALLOWED_ORIGINS / CORS_PREVIEW_ORIGIN_SUFFIX values
        # `wrangler dev` picks up from apps/api/.dev.vars + wrangler.toml,
        # so the CORS specs in apps/api/test exercise identical behavior
        # on both runtimes (ADR-012's parity obligation).
        run: |
          docker run -d --name api-parity -p 8787:8787 \
            -e CORS_ALLOWED_ORIGINS=https://avash.pages.dev,http://localhost:5173 \
            -e CORS_PREVIEW_ORIGIN_SUFFIX=avash.pages.dev \
            avash-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run the API contract suite against the container (identical specs, Node runtime)
        env:
          API_TEST_TARGET: container
        run: pnpm --filter api test:e2e

      - name: Dump container logs (always, for debugging)
        if: always()
        run: docker logs api-parity 2>&1 || echo "::notice::no api-parity container logs to show"

      - name: Remove the container (always, cleanup)
        if: always()
        run: docker rm -f api-parity 2>&1 || echo "::notice::api-parity container already removed"

  # docs/PROJECT_PLAN.md §4 / §4.2 — a health-gated PostGIS service
  # container that migration and RLS steps drop straight into once the
  # schema exists. Deliberately thin today: it proves CI has a real
  # spatial database available rather than discovering later that it has
  # none.
  postgis-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # POSTGIS_LOCAL_IMAGE (docs/PROJECT_PLAN.md §14) — byte-identical to
      # compose.yaml's `db` service image. No credential is referenced; the
      # user/password below are throwaway, local-only values, never real
      # Supabase credentials.
      postgis:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for PostGIS health
        run: |
          for _ in $(seq 1 20); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done

      - name: Verify PostGIS and pgcrypto extensions
        env:
          PGPASSWORD: postgres
        run: |
          # Mirrors docker/postgis/initdb/00-extensions.sql. The service
          # container above has no bind-mount for that script (GitHub
          # Actions starts service containers before any step runs, so a
          # checked-out file cannot be mounted into it) — this step is the
          # CI-side equivalent, idempotent and identical in effect.
          psql -h 127.0.0.1 -U postgres -d avash -c "create extension if not exists postgis;"
          psql -h 127.0.0.1 -U postgres -d avash -c "create extension if not exists pgcrypto;"
          psql -h 127.0.0.1 -U postgres -d avash -c "select postgis_version();"
          psql -h 127.0.0.1 -U postgres -d avash -c "select extname from pg_extension;" | tee /tmp/extensions.txt
          grep -q "postgis" /tmp/extensions.txt
          grep -q "pgcrypto" /tmp/extensions.txt
