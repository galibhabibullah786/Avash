# version: 2

# # Four entries, one grouped pull request each, instead of fifteen entries
# # producing a pull request per directory per package.
# #
# # WHY GROUPED ACROSS DIRECTORIES: Dependabot resolves "latest" per
# # directory, independently, at whatever moment it runs — so one package
# # pinned in several workspaces used to arrive as several uncoordinated
# # pull requests. That produced real breakage here: zod bumped in
# # packages/types and apps/api but not apps/web; react bumped without
# # react-dom; typescript opened against two different majors at once
# # because the root and apps/web were resolved at different times. A single
# # grouped update across `directories` bumps every copy of a package in the
# # same pull request, so the workspace cannot go inconsistent between
# # merges.
# #
# # WHY MAJORS ARE IN THE GROUP: keeping them separate is the usual advice,
# # and the trade-off is real — a breaking major lands alongside routine
# # patches and the whole group has to be reverted together. It is accepted
# # deliberately: this repo pins the same packages in up to eleven
# # manifests, and an ungrouped major is exactly the update that arrives for
# # one manifest and not the others. Review the group, do not rubber-stamp
# # it.
# #
# # Each grouped pull request squash-merges to a single commit, which is
# # what keeps the history readable — roughly four dependency commits a
# # month rather than thirty.

